<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070b14">

<title>Gootoo — Местоположение</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(0,229,255,.18),transparent 32%),
    radial-gradient(circle at 85% 85%,rgba(124,58,237,.20),transparent 35%),
    linear-gradient(145deg,#050810,#0a1020,#060913);
}

.card{
  width:100%;
  max-width:430px;
  padding:30px 22px 22px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  background:rgba(17,24,39,.78);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.logo{
  width:74px;
  height:74px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  font-size:34px;
  background:linear-gradient(145deg,rgba(0,229,255,.2),rgba(124,58,237,.25));
  border:1px solid rgba(255,255,255,.12);
}

h1{
  margin:0;
  text-align:center;
  font-size:32px;
  letter-spacing:-1px;
}

.subtitle{
  margin:10px 0 0;
  text-align:center;
  color:#94a3b8;
  font-size:15px;
  line-height:1.5;
}

.notice{
  margin-top:24px;
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5;
}

button{
  width:100%;
  margin-top:20px;
  padding:17px;
  border:0;
  border-radius:17px;
  color:#031016;
  background:linear-gradient(135deg,#67f8ff,#00d9ee,#72e8ff);
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.status{
  min-height:24px;
  margin-top:18px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

.success{
  color:#4ade80;
}

.error{
  color:#fb7185;
}

.result{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
}

.result.show{
  display:block;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#64748b;
}

.value{
  color:#e2e8f0;
  font-weight:700;
  text-align:right;
}

.footer{
  margin-top:18px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">📍</div>

  <h1>Gootoo</h1>

  <p class="subtitle">
    Определение текущего местоположения
  </p>

  <div class="notice">
    🛡️ Для определения местоположения необходимо
    разрешение браузера. Координаты отправляются
    только после вашего согласия.
  </div>

  <button id="locationButton">
    📍 Определить местоположение
  </button>

  <div id="status" class="status">
    Готово
  </div>

  <div id="result" class="result">

    <div class="row">
      <span class="label">Широта</span>
      <span id="lat" class="value">—</span>
    </div>

    <div class="row">
      <span class="label">Долгота</span>
      <span id="lon" class="value">—</span>
    </div>

    <div class="row">
      <span class="label">Точность</span>
      <span id="acc" class="value">—</span>
    </div>

  </div>

  <div class="footer">
    🔒 Геолокация запрашивается только после
    нажатия кнопки и системного разрешения.
  </div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxAWBwp0JRdjsU-GlgPi3cGUI-XxKbBbg3ltkY1uO37xF4tGFwyVvfPCeZKXLk_WuJndw/exec";

const button =
document.getElementById("locationButton");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const lat =
document.getElementById("lat");

const lon =
document.getElementById("lon");

const acc =
document.getElementById("acc");


function setStatus(text,type=""){
  status.className="status "+type;
  status.textContent=text;
}


function sendToServer(data){

  return fetch(
    SCRIPT_URL,
    {
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(data)
    }
  );

}


function getLocation(){

  return new Promise((resolve,reject)=>{

    navigator.geolocation.getCurrentPosition(
      resolve,
      reject,
      {
        enableHighAccuracy:true,
        timeout:20000,
        maximumAge:0
      }
    );

  });

}


async function start(){

  if(!window.isSecureContext){

    setStatus(
      "❌ Сайт должен открываться через HTTPS.",
      "error"
    );

    return;
  }


  if(!navigator.geolocation){

    setStatus(
      "❌ Геолокация не поддерживается.",
      "error"
    );

    return;
  }


  button.disabled=true;

  button.textContent=
  "Определяем местоположение…";

  setStatus(
    "Ожидаем разрешение браузера…"
  );


  try{

    const position=
    await getLocation();

    const coords=
    position.coords;


    const data={

      latitude:
      coords.latitude,

      longitude:
      coords.longitude,

      accuracy:
      coords.accuracy,

      altitude:
      coords.altitude,

      altitudeAccuracy:
      coords.altitudeAccuracy,

      heading:
      coords.heading,

      speed:
      coords.speed,

      timestamp:
      new Date().toISOString(),

      userAgent:
      navigator.userAgent

    };


    lat.textContent=
    Number(data.latitude).toFixed(6);

    lon.textContent=
    Number(data.longitude).toFixed(6);

    acc.textContent=
    Math.round(data.accuracy)+" м";

    result.classList.add("show");


    setStatus(
      "Отправляем данные…"
    );


    await sendToServer(data);


    setStatus(
      "✓ Местоположение получено.",
      "success"
    );

    button.textContent=
    "✓ Готово";


  }catch(error){

    console.error(error);


    if(error.code===1){

      setStatus(
        "❌ Доступ к местоположению запрещён.",
        "error"
      );

    }else if(error.code===2){

      setStatus(
        "❌ Местоположение недоступно.",
        "error"
      );

    }else if(error.code===3){

      setStatus(
        "❌ Время ожидания истекло.",
        "error"
      );

    }else{

      setStatus(
        "❌ Не удалось определить местоположение.",
        "error"
      );

    }


    button.disabled=false;

    button.textContent=
    "↻ Попробовать снова";

  }

}


button.addEventListener(
  "click",
  start
);

</script>

</body>
</html>
